<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador BIOS Legacy / Instalación de SO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#080808; overflow:hidden; }
  .biosfont { font-family: "Courier New", Courier, monospace; }
  .uifont   { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
  #monitor  { transform-origin: center center; }
  .btn { padding: 6px 20px; border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.08); color: #fff; font-size: 14px; transition: background .12s; }
  .btn:hover { background: rgba(255,255,255,.20); }
  .btn-primary { background:#2f6ea8; }
  .btn-primary:hover { background:#3d84c4; }
  select, input { outline: none; }
  select option { background:#0f2c45; color:#fff; }
  .part-row { transition: background .1s; }
  @keyframes pulseRed { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.8); } 50% { box-shadow: 0 0 0 14px rgba(220,38,38,0); } }
  .pulse-red { animation: pulseRed 1.4s infinite; }
  @keyframes winShow { from { opacity:0; transform: scale(.96) translateY(8px); } to { opacity:1; transform: scale(1) translateY(0); } }
  .win-show { animation: winShow .16s ease-out; }
  @keyframes toastIn { from { opacity:0; transform: translateX(30px); } to { opacity:1; transform: translateX(0); } }
  .toast-in { animation: toastIn .25s ease-out; }
  @keyframes lockShake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .lock-shake { animation: lockShake .35s ease-in-out; }
  @keyframes spin360 { to { transform: rotate(360deg); } }
  .spin { animation: spin360 1s linear infinite; }
  @keyframes fadeSlide { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
  .fade-slide { animation: fadeSlide .3s ease-out; }
  ::-webkit-scrollbar { width: 10px; height:10px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,.06); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); border-radius:5px; }
  .win-shadow { box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07); }
</style>
</head>
<body>

<div id="monitorWrap" class="fixed inset-0 flex items-center justify-center">
  <div id="monitor" class="relative rounded-[16px] bg-neutral-800 p-3 shadow-[0_0_80px_rgba(0,0,0,.95)]">
    <div id="screen" class="relative overflow-hidden bg-black" style="width:1024px;height:768px;">
      <div id="view-bios" class="absolute inset-0 hidden biosfont" style="pointer-events:none;user-select:none;"></div>
      <div id="view-blank" class="absolute inset-0 hidden bg-black"></div>
      <div id="view-bootprompt" class="absolute inset-0 hidden bg-black uifont"></div>
      <div id="view-installer" class="absolute inset-0 hidden uifont"></div>
      <div id="view-restart" class="absolute inset-0 hidden uifont"></div>
      <div id="view-oobe" class="absolute inset-0 hidden uifont"></div>
      <div id="view-desktop" class="absolute inset-0 hidden uifont"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   UTILIDADES GENERALES
   ========================================================= */
const VIEW_IDS = ['bios','blank','bootprompt','installer','restart','oobe','desktop'];
let currentView = 'bios';

function showView(name){
  VIEW_IDS.forEach(v=>{
    const el = document.getElementById('view-'+v);
    if(el) el.classList.toggle('hidden', v !== name);
  });
  currentView = name;
}
function fitMonitor(){
  const m = document.getElementById('monitor');
  const s = Math.min(window.innerWidth / 1080, window.innerHeight / 830, 1);
  m.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fitMonitor);

/* =========================================================
   BIOS
   ========================================================= */
const TABS = ['Main','Advanced','Security','Boot','Exit'];
const USB_NAME = 'USB HDD: Kingston DataTraveler 32GB';
const HDD_NAME = 'Hard Drive: WDC WD5000AAKX 500GB';

const bios = {
  tab: 0, row: 0, submenu: null,
  step1: false, step2: false,
  secureBoot: 'Enabled',
  bootOrder: [HDD_NAME, USB_NAME, 'Disabled'],
  dialog: null, msg: null, msgTimer: null
};

function getTabRows(tab){
  if(tab === 0) return [
    { kind:'header', label:'System Information' },
    { label:'BIOS Vendor',   value:'American Megatrends Inc.', desc:'Muestra el fabricante del BIOS.' },
    { label:'BIOS Version',  value:'2.05.1206',               desc:'Versión del firmware instalado.' },
    { label:'System Date',   value:'[Wed 04/10/2026]',        desc:'Fecha del sistema.' },
    { label:'System Time',   value:'[10:24:37]',              desc:'Hora del sistema.' },
    { kind:'header', label:'Storage Configuration' },
    { label:'SATA Port 0',   value:'WDC WD5000AAKX 500GB',    desc:'Disco duro interno detectado en el puerto SATA 0.' },
    { label:'SATA Port 1',   value:'Not Detected',            desc:'No se detecta ningún dispositivo en el puerto SATA 1.' },
    { label:'USB Storage Device', value:'Kingston DataTraveler 32GB', desc:'Unidad de almacenamiento USB detectada.' },
    { label:'USB Controller', value:'Enabled',                desc:'Controladora USB integrada.' },
    { label:'Total Memory',  value:'4096 MB DDR3',            desc:'Memoria RAM instalada.' }
  ];
  if(tab === 1) return [
    { kind:'header', label:'Advanced Settings' },
    { label:'Legacy USB Support', value:'Enabled',   desc:'Soporte USB en modo heredado.' },
    { label:'XHCI Hand-off',      value:'Enabled',   desc:'Transferencia de control del controlador XHCI al SO.' },
    { label:'CSM Configuration',  value:'Enabled',   desc:'Módulo de soporte de compatibilidad (Legacy).' },
    { label:'Boot Mode',          value:'Legacy BIOS', desc:'Modo de arranque actual del firmware.' },
    { kind:'header', label:'Detected Storage Devices' },
    { label:'Internal HDD',  value:'WDC WD5000AAKX 500GB',        desc:'Disco duro interno.' },
    { label:'Removable USB', value:'Kingston DataTraveler 32GB',  desc:'Unidad USB extraíble conectada.' },
    { kind:'header', label:'CPU Configuration' },
    { label:'Processor',   value:'Intel Core i5-3470 @ 3.20GHz', desc:'Procesador instalado.' },
    { label:'Hyper-Threading', value:'Enabled', desc:'Tecnología de subprocesos simultáneos.' }
  ];
  if(tab === 2) return [
    { kind:'header', label:'Security Configuration' },
    { label:'Administrator Password', value:'Not Installed', desc:'Contraseña de administrador del BIOS.' },
    { label:'User Password',          value:'Not Installed', desc:'Contraseña de usuario del BIOS.' },
    { label:'Secure Boot', value: bios.secureBoot, action:'secureBoot', desc:'Secure Boot impide la carga de controladores y sistemas operativos no firmados.' },
    { label:'Secure Boot Mode', value:'Standard', desc:'Modo de configuración de Secure Boot.' },
    { kind:'header', label:'HDD Security Status' },
    { label:'HDD 0: WDC WD5000AAKX', value:'Supported', desc:'Estado de seguridad del disco duro.' }
  ];
  if(tab === 3) return [
    { label:'Boot Option Priorities', value:'', action:'openBootPriorities', desc:'Especifica la secuencia de arranque de los dispositivos disponibles.' },
    { kind:'header', label:'Boot Settings' },
    { label:'Boot Mode',    value:'Legacy Only', desc:'Modo de arranque del sistema.' },
    { label:'Fast Boot',    value:'Disabled',    desc:'Arranque rápido del firmware.' },
    { label:'USB Boot',     value:'Enabled',     desc:'Permite el arranque desde dispositivos USB.' },
    { label:'Network Boot', value:'Disabled',    desc:'Permite el arranque desde la red.' },
    { label:'Quiet Boot',   value:'Enabled',     desc:'Oculta los mensajes POST durante el arranque.' }
  ];
  return [
    { kind:'header', label:'Exit Options' },
    { label:'Save Changes and Exit',    action:'saveExit',    desc:'Sale de la configuración guardando los cambios.' },
    { label:'Save Changes and Reset',   action:'saveExit',    desc:'Guarda los cambios y reinicia el equipo.' },
    { label:'Discard Changes and Exit', action:'discardExit', desc:'Sale sin guardar los cambios realizados.' },
    { label:'Discard Changes and Reset',action:'discardExit', desc:'Descarta los cambios y reinicia el equipo.' },
    { label:'Load Setup Defaults',      action:'discardExit', desc:'Carga los valores predeterminados de fábrica.' }
  ];
}
function bootPrioritiesRows(){
  return [
    { kind:'header', label:'Boot Option Priorities' },
    { label:'Boot Option #1', value: bios.bootOrder[0], action:'cycleBoot', idx:0, desc:'Primer dispositivo de arranque del sistema.' },
    { label:'Boot Option #2', value: bios.bootOrder[1], action:'cycleBoot', idx:1, desc:'Segundo dispositivo de arranque del sistema.' },
    { label:'Boot Option #3', value: bios.bootOrder[2], action:'cycleBoot', idx:2, desc:'Tercer dispositivo de arranque del sistema.' }
  ];
}
function currentRows(){ return bios.submenu ? bios.submenu.getRows() : getTabRows(bios.tab); }
function firstSelectable(rows){ for(let i=0;i<rows.length;i++) if(rows[i].kind !== 'header') return i; return 0; }

function renderBios(){
  const root = document.getElementById('view-bios');
  const rows = currentRows();
  const tabsHtml = TABS.map((t,i)=>{
    const active = (i === bios.tab);
    return `<span class="px-4 py-[1px] ${active ? 'bg-[#FFFF55] text-[#0000AA] font-bold' : 'text-white'}">${t}</span>`;
  }).join('');

  let bodyHtml = '';
  if(bios.submenu) bodyHtml += `<div class="text-[#FFFF55] mb-2 mt-1">&nbsp;${bios.submenu.title}</div>`;
  rows.forEach((r,i)=>{
    if(r.kind === 'header'){
      bodyHtml += `<div class="mt-3 mb-1 text-[#FFFF55]">${r.label}</div>`;
    } else {
      const sel = (i === bios.row);
      const cls = sel ? 'bg-[#FFFF55] text-[#0000AA]' : 'text-white';
      const val = (r.value !== undefined && r.value !== null) ? r.value : '';
      bodyHtml += `<div class="flex justify-between px-2 ${cls}">
          <span>${sel ? '&#9658;&nbsp;' : '&nbsp;&nbsp;'}${r.label}</span>
          <span>${val}</span>
        </div>`;
    }
  });
  const selRow = rows[bios.row];
  const helpText = (selRow && selRow.desc) ? selRow.desc : '&nbsp;';

  root.innerHTML = `
    <div class="absolute inset-0 p-[6px]" style="background:#0000AA">
      <div class="w-full h-full flex flex-col" style="border:2px solid #C0C0C0">
        <div class="flex justify-between px-3 pt-1 text-[13px] text-white">
          <span>BIOS Setup Utility &nbsp;-&nbsp; Copyright (C) 2012 American Megatrends, Inc.</span>
          <span>v2.05.1206</span>
        </div>
        <div class="flex gap-1 px-2 mt-1">${tabsHtml}</div>
        <div class="mx-2 mt-1" style="border-bottom:1px solid #C0C0C0"></div>
        <div class="flex flex-1 overflow-hidden">
          <div class="flex-1 px-3 py-1 text-[15px] leading-[1.45] overflow-hidden">${bodyHtml}</div>
          <div class="w-[300px] px-3 py-2 text-[12px] leading-snug text-white" style="border-left:1px solid #808080">
            <div class="text-[#FFFF55] mb-2">Item Specific Help</div>
            <div>${helpText}</div>
          </div>
        </div>
        <div class="mx-2" style="border-top:1px solid #C0C0C0"></div>
        <div class="px-3 py-[3px] text-[12px] text-white flex flex-wrap gap-x-6">
          <span>&#8593;&#8595; Select Item</span><span>&#8592;&#8594; Select Screen</span>
          <span>Enter: Select</span><span>F10: Save &amp; Exit</span><span>ESC: Exit</span>
        </div>
      </div>
    </div>
    ${bios.msg ? `<div class="absolute left-1/2 -translate-x-1/2 bottom-[64px] bg-[#AA0000] text-white px-5 py-2 text-[13px] max-w-[860px] text-center" style="border:1px solid #FFFFFF">${bios.msg}</div>` : ''}
    ${bios.dialog ? `
      <div class="absolute inset-0 flex items-center justify-center" style="background:rgba(0,0,0,.45)">
        <div style="background:#0000AA;border:2px solid #C0C0C0" class="px-10 py-6 text-[15px] text-white">
          <div class="mb-5">Save configuration changes and exit now?</div>
          <div class="flex justify-center gap-10">
            <span class="${bios.dialog.row===0 ? 'bg-[#FFFF55] text-[#0000AA] px-4 font-bold' : 'px-4'}">Yes</span>
            <span class="${bios.dialog.row===1 ? 'bg-[#FFFF55] text-[#0000AA] px-4 font-bold' : 'px-4'}">No</span>
          </div>
          <div class="mt-5 text-[11px] text-center text-white/70">&#8592; &#8594; Seleccionar &nbsp;&nbsp;|&nbsp;&nbsp; Enter: Aceptar</div>
        </div>
      </div>` : ''}
  `;
}
function showBiosMsg(text){
  bios.msg = text;
  clearTimeout(bios.msgTimer);
  bios.msgTimer = setTimeout(()=>{ bios.msg = null; renderBios(); }, 4200);
  renderBios();
}
function moveRow(dir){
  const rows = currentRows();
  let i = bios.row;
  for(let k=0;k<rows.length;k++){
    i += dir;
    if(i < 0) i = rows.length - 1;
    if(i >= rows.length) i = 0;
    if(rows[i].kind !== 'header'){ bios.row = i; return; }
  }
}
function switchTab(dir){
  bios.tab = (bios.tab + dir + TABS.length) % TABS.length;
  bios.submenu = null;
  bios.row = firstSelectable(getTabRows(bios.tab));
}
function cycleBoot(idx){
  const values = [HDD_NAME, USB_NAME, 'Disabled'];
  const cur  = bios.bootOrder[idx];
  const next = values[(values.indexOf(cur) + 1) % values.length];
  const j = bios.bootOrder.indexOf(next);
  if(j !== -1 && j !== idx) bios.bootOrder[j] = cur;
  bios.bootOrder[idx] = next;
  bios.step1 = (bios.bootOrder[0] === USB_NAME);
}
function toggleSecureBoot(){
  if(!bios.step1){ showBiosMsg('ERROR: Debe configurar primero el orden de arranque en Boot &gt; Boot Option Priorities.'); return; }
  bios.secureBoot = (bios.secureBoot === 'Enabled') ? 'Disabled' : 'Enabled';
  bios.step2 = (bios.secureBoot === 'Disabled');
}
function activateRow(){
  const rows = currentRows();
  const r = rows[bios.row];
  if(!r || r.kind === 'header') return;
  if(bios.submenu){
    if(r.action === 'cycleBoot') cycleBoot(r.idx);
    return;
  }
  switch(r.action){
    case 'openBootPriorities':
      bios.submenu = { title:'Boot Option Priorities', getRows: bootPrioritiesRows };
      bios.row = firstSelectable(bootPrioritiesRows());
      break;
    case 'secureBoot': toggleSecureBoot(); break;
    case 'saveExit':   trySaveExit(); break;
    case 'discardExit': showBiosMsg('ERROR: Los cambios no se han guardado. Utilice "Save Changes and Exit".'); break;
  }
}
function trySaveExit(){
  if(bios.dialog) return;
  if(!bios.step1){ showBiosMsg('ERROR: No se ha configurado el dispositivo de arranque. Establezca "Boot Option #1" con la unidad USB.'); return; }
  if(!bios.step2){ showBiosMsg('ERROR: Secure Boot continúa habilitado. Desactívelo en la pestaña Security.'); return; }
  bios.dialog = { row: 0 };
  renderBios();
}
function handleBiosKey(e){
  const k = e.key;
  const allowed = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','F10','Tab'];
  if(!allowed.includes(k)) return;
  e.preventDefault();
  if(bios.dialog){
    if(k === 'ArrowLeft' || k === 'ArrowRight' || k === 'Tab'){ bios.dialog.row = bios.dialog.row === 0 ? 1 : 0; renderBios(); }
    else if(k === 'Enter'){ if(bios.dialog.row === 0){ saveAndExit(); } else { bios.dialog = null; renderBios(); } }
    else if(k === 'Escape'){ bios.dialog = null; renderBios(); }
    return;
  }
  if(k === 'F10'){ trySaveExit(); return; }
  if(k === 'ArrowUp')        moveRow(-1);
  else if(k === 'ArrowDown') moveRow(1);
  else if(k === 'ArrowLeft'){ if(!bios.submenu) switchTab(-1); }
  else if(k === 'ArrowRight'){ if(!bios.submenu) switchTab(1); }
  else if(k === 'Enter')     activateRow();
  else if(k === 'Escape'){ if(bios.submenu){ bios.submenu = null; bios.row = firstSelectable(getTabRows(bios.tab)); } }
  renderBios();
}
function saveAndExit(){
  bios.dialog = null; bios.msg = null; renderBios();
  showView('blank');
  setTimeout(()=>{ startBootPrompt(); }, 1600);
}

/* =========================================================
   PROMPT DE ARRANQUE USB
   ========================================================= */
let bootPromptTimer = null;
let bootPromptSeconds = 5;
function startBootPrompt(){
  showView('bootprompt');
  const root = document.getElementById('view-bootprompt');
  root.innerHTML = `
    <div class="absolute inset-0 bg-black flex flex-col items-center justify-center text-white">
      <div id="bpText" class="text-[26px] tracking-wide">Press any key to boot from USB...</div>
      <div class="mt-8 text-sm text-white/50">Arrancando en <span id="bpCount">5</span> s</div>
      <div class="mt-3 w-[320px] h-[3px] bg-white/20"><div id="bpBar" class="h-full bg-white/70" style="width:100%"></div></div>
    </div>`;
  bootPromptSeconds = 5;
  clearInterval(bootPromptTimer);
  const upd = ()=>{ const c = document.getElementById('bpCount'); const b = document.getElementById('bpBar');
    if(c) c.textContent = bootPromptSeconds; if(b) b.style.width = (bootPromptSeconds / 5 * 100) + '%'; };
  upd();
  bootPromptTimer = setInterval(()=>{
    bootPromptSeconds--;
    if(bootPromptSeconds <= 0){ clearInterval(bootPromptTimer); bootPromptTimer = null; bootPromptTimeout(); return; }
    upd();
  }, 1000);
}
function handleBootPromptKey(e){
  if(['F5','F12'].includes(e.key)) return;
  e.preventDefault();
  if(bootPromptTimer){ clearInterval(bootPromptTimer); bootPromptTimer = null; startInstaller(); }
}
function bootPromptTimeout(){
  const t = document.getElementById('bpText');
  if(t) t.innerHTML = 'Operating System not found.<br><span class="text-sm text-neutral-500">Reiniciando el equipo...</span>';
  setTimeout(()=>{ startBootPrompt(); }, 2600);
}

/* =========================================================
   INSTALADOR GRÁFICO
   ========================================================= */
const BG = 'background:linear-gradient(160deg,#1c4b73 0%,#0d2438 100%)';
function startInstaller(){ showView('installer'); renderInstaller('lang'); }
function renderInstaller(screen){
  const root = document.getElementById('view-installer');
  if(screen === 'lang'){ root.innerHTML = langHTML(); wireLang(); }
  else if(screen === 'installnow'){ root.innerHTML = installNowHTML(); wireInstallNow(); }
  else if(screen === 'key'){ root.innerHTML = keyHTML(); wireKey(); }
  else if(screen === 'partitions'){ renderPartitions(); }
  else if(screen === 'wifi'){ renderWifiStep(); }
  else if(screen === 'copy'){ root.innerHTML = copyHTML(); runCopy(); }
}

function langHTML(){
  const sel = 'w-full bg-[#0f2c45] border border-white/40 px-3 py-2 mb-5 text-white';
  return `
  <div class="absolute inset-0 flex items-center justify-center" style="${BG}">
    <div class="w-[640px] text-white">
      <div class="text-[30px] mb-10 font-light">Instalación de Windows</div>
      <div class="mb-1 text-[13px] text-white/85">Idioma que desea instalar</div>
      <select id="selIdioma" class="${sel}"><option>Español (España)</option><option>Español (México)</option><option>English (United States)</option></select>
      <div class="mb-1 text-[13px] text-white/85">Formato de hora y moneda</div>
      <select id="selHora" class="${sel}"><option>Español (España)</option><option>Español (México)</option></select>
      <div class="mb-1 text-[13px] text-white/85">Distribución del teclado</div>
      <select id="selTeclado" class="${sel}"><option>Español</option><option>Latinoamericano</option></select>
      <div class="flex justify-end mt-8"><button id="btnLangNext" class="btn btn-primary px-12 py-2">Siguiente</button></div>
    </div>
  </div>`;
}
function wireLang(){ document.getElementById('btnLangNext').addEventListener('click', ()=> renderInstaller('installnow')); }

function installNowHTML(){
  return `
  <div class="absolute inset-0 flex items-center justify-center" style="${BG}">
    <button id="btnInstallNow" class="text-white text-[42px] font-light tracking-wide border-2 border-white/40 px-16 py-10 hover:bg-white/10 transition-colors">Instalar ahora</button>
  </div>`;
}
function wireInstallNow(){ document.getElementById('btnInstallNow').addEventListener('click', ()=> renderInstaller('key')); }

let selectedInstallType = null;
function keyHTML(){
  return `
  <div class="absolute inset-0 flex items-center justify-center" style="${BG}">
    <div class="w-[700px] text-white">
      <div class="text-[24px] font-light mb-6">Activar Windows</div>
      <input id="inpKey" placeholder="Escriba la clave de producto" class="w-full bg-[#0f2c45] border border-white/40 px-3 py-2 mb-3 text-white placeholder-white/35">
      <label class="flex items-center gap-2 text-[13px] mb-8 cursor-pointer"><input type="checkbox" id="chkNoKey" class="w-4 h-4"> No tengo clave de producto</label>
      <div class="text-[19px] font-light mb-3">Seleccione el tipo de instalación</div>
      <div id="optUpgrade" class="border border-white/25 px-4 py-3 mb-3 cursor-pointer hover:bg-white/10">
        <div class="text-[15px]">Actualizar: conservar archivos, configuraciones y aplicaciones</div>
        <div class="text-[12px] text-white/60 mt-1">Requiere que el equipo ya tenga un sistema operativo instalado.</div>
      </div>
      <div id="optCustom" class="border border-white/25 px-4 py-3 mb-6 cursor-pointer hover:bg-white/10">
        <div class="text-[15px]">Personalizada: instalar solo el sistema operativo (avanzado)</div>
        <div class="text-[12px] text-white/60 mt-1">Los archivos, configuraciones y aplicaciones no se conservan.</div>
      </div>
      <label class="flex items-center gap-2 text-[13px] mb-4 cursor-pointer"><input type="checkbox" id="chkTerms" class="w-4 h-4"> Acepto los términos y condiciones de la licencia.</label>
      <div id="keyError" class="text-red-300 text-[13px] h-5 mb-2"></div>
      <div class="flex justify-between">
        <button id="btnKeyBack" class="btn">Atrás</button>
        <button id="btnKeyNext" class="btn btn-primary px-12">Siguiente</button>
      </div>
    </div>
  </div>`;
}
function wireKey(){
  selectedInstallType = null;
  const inpKey = document.getElementById('inpKey');
  const chkNo = document.getElementById('chkNoKey');
  const chkTerm = document.getElementById('chkTerms');
  const optUp = document.getElementById('optUpgrade');
  const optCu = document.getElementById('optCustom');
  const err = document.getElementById('keyError');
  const setErr = (m)=>{ err.textContent = m || ''; };
  const paint = ()=>{
    [[optUp,'upgrade'],[optCu,'custom']].forEach(([el,key])=>{
      if(selectedInstallType === key){ el.style.background = 'rgba(47,110,168,.65)'; el.style.borderColor = '#8fc4ec'; }
      else { el.style.background = 'transparent'; el.style.borderColor = 'rgba(255,255,255,.25)'; }
    });
  };
  chkNo.addEventListener('change', ()=>{
    if(chkNo.checked){ inpKey.value=''; inpKey.disabled=true; inpKey.style.opacity='.45'; }
    else { inpKey.disabled=false; inpKey.style.opacity='1'; }
    setErr('');
  });
  inpKey.addEventListener('input', ()=>{ if(inpKey.value.trim().length>0){ chkNo.checked=false; inpKey.disabled=false; inpKey.style.opacity='1'; } setErr(''); });
  optUp.addEventListener('click', ()=>{ selectedInstallType='upgrade'; paint(); setErr(''); });
  optCu.addEventListener('click', ()=>{ selectedInstallType='custom';  paint(); setErr(''); });

/* =========================================================
   GESTOR DE PARTICIONES
   ========================================================= */
const TOTAL_MB = 512000;
let disk = {
  partitions: [
    { id:1, label:'Partición 1', type:'Reservado por el sistema', mb:500,    system:true  },
    { id:2, label:'Partición 2', type:'Principal',                mb:204800, system:false },
    { id:3, label:'Partición 3', type:'Principal',                mb:306700, system:false }
  ],
  unallocatedMB: 0
};
let selectedPart = null;
let pending = null;
function fmtMB(mb){ return mb >= 1024 ? (mb/1024).toFixed(1) + ' GB' : mb.toFixed(1) + ' MB'; }
function recalcDisk(){
  const used = disk.partitions.reduce((a,p)=>a+p.mb, 0);
  const pend = pending ? pending.mb : 0;
  disk.unallocatedMB = Math.max(0, TOTAL_MB - used - pend);
}
function partitionRowsHTML(){
  let html = '';
  disk.partitions.forEach(p=>{
    const sel = (selectedPart === p.id);
    html += `
      <div data-pid="${p.id}" class="part-row flex items-center gap-4 px-5 py-3 cursor-pointer border-b border-white/10 ${sel ? 'bg-[#2b6cb0]' : 'hover:bg-white/10'}">
        <div class="text-[22px] leading-none">&#128190;</div>
        <div>
          <div class="text-[14px]">Disco 0 ${p.label}</div>
          <div class="text-[12px] text-white/65">${p.type} &nbsp;|&nbsp; ${fmtMB(p.mb)}</div>
        </div>
      </div>`;
  });
  if(pending) html += `
      <div class="flex items-center gap-4 px-5 py-3 border-b border-white/10 bg-[#1f4e79]">
        <div class="text-[22px] leading-none">&#128190;</div>
        <div>
          <div class="text-[14px]">Disco 0 Partición ${disk.partitions.length + 1} <span class="text-yellow-300">(pendiente)</span></div>
          <div class="text-[12px] text-white/65">Principal &nbsp;|&nbsp; ${fmtMB(pending.mb)}</div>
        </div>
      </div>`;
  if(disk.unallocatedMB > 0) html += `
      <div class="flex items-center gap-4 px-5 py-3 border-b border-white/10">
        <div class="text-[22px] leading-none opacity-40">&#9647;</div>
        <div>
          <div class="text-[14px] text-white/80">Disco 0 Espacio no asignado</div>
          <div class="text-[12px] text-white/55">${fmtMB(disk.unallocatedMB)}</div>
        </div>
      </div>`;
  return html || '<div class="p-5 text-[13px] text-white/60">No se han detectado particiones.</div>';
}
function renderPartitions(){
  const root = document.getElementById('view-installer');
  root.innerHTML = `
    <div class="absolute inset-0 flex flex-col text-white" style="${BG}">
      <div class="px-12 pt-9 flex-1 flex flex-col">
        <div class="text-[26px] font-light mb-1">¿Dónde quieres instalar Windows?</div>
        <div id="partList" class="mt-4 border border-white/25 h-[330px] overflow-y-auto bg-black/25"></div>
        <div id="partMsg" class="text-[13px] h-6 mt-2 text-red-300"></div>
        <div class="flex justify-end gap-2 mb-7">
          <button data-act="refresh" class="btn">Actualizar</button>
          <button data-act="delete"  class="btn">Eliminar</button>
          <button data-act="new"     class="btn">Nuevo</button>
          <button data-act="apply"   class="btn">Aplicar</button>
          <button data-act="next"    class="btn btn-primary px-10">Siguiente</button>
        </div>
      </div>
    </div>`;
  updatePartList();
  root.querySelectorAll('[data-act]').forEach(b=> b.addEventListener('click', ()=> partAction(b.dataset.act)));
}
function updatePartList(){
  const list = document.getElementById('partList');
  if(!list) return;
  list.innerHTML = partitionRowsHTML();
  list.querySelectorAll('[data-pid]').forEach(el=>{
    el.addEventListener('click', ()=>{ selectedPart = parseInt(el.dataset.pid, 10); setPartMsg(''); updatePartList(); });
  });
}
function setPartMsg(text, isError){
  const el = document.getElementById('partMsg');
  if(!el) return;
  el.textContent = text || '';
  el.className = 'text-[13px] h-6 mt-2 ' + (isError === false ? 'text-emerald-300' : 'text-red-300');
}
function commitPending(){
  const total = pending.mb;
  const base  = disk.partitions.length ? Math.max(...disk.partitions.map(p=>p.id)) : 0;
  if(total > 600){
    disk.partitions.push({ id:base+1, label:'Partición '+(base+1), type:'Reservado por el sistema', mb:500, system:true });
    disk.partitions.push({ id:base+2, label:'Partición '+(base+2), type:'Principal', mb: total - 500, system:false });
  } else {
    disk.partitions.push({ id:base+1, label:'Partición '+(base+1), type:'Principal', mb: total, system:false });
  }
  pending = null;
  recalcDisk();
}
function partAction(act){
  if(act === 'refresh'){ setPartMsg('No se han detectado cambios.', false); updatePartList(); return; }
  if(act === 'delete'){
    if(selectedPart === null){ setPartMsg('Seleccione una partición para eliminar.'); return; }
    const idx = disk.partitions.findIndex(p=>p.id === selectedPart);
    if(idx < 0){ setPartMsg('Seleccione una partición válida.'); return; }
    disk.partitions.splice(idx, 1);
    selectedPart = null; recalcDisk(); updatePartList();
    setPartMsg('Partición eliminada.', false);
    return;
  }
  if(act === 'new'){
    if(pending){ setPartMsg('Ya existe una operación pendiente.'); return; }
    if(disk.unallocatedMB <= 0){ setPartMsg('No hay espacio no asignado. Elimine primero las particiones.'); return; }
    pending = { mb: disk.unallocatedMB };
    recalcDisk(); updatePartList();
    setPartMsg('Partición creada (pendiente). Pulse "Aplicar".', false);
    return;
  }
  if(act === 'apply'){
    if(!pending){ setPartMsg('No hay cambios pendientes que aplicar.'); return; }
    commitPending(); updatePartList();
    setPartMsg('Cambios aplicados. Estructura de partición MBR creada.', false);
    return;
  }
  if(act === 'next'){
    if(pending){ setPartMsg('Aplique los cambios pendientes antes de continuar.'); return; }
    if(selectedPart === null){ setPartMsg('Seleccione la partición donde instalar Windows.'); return; }
    const p = disk.partitions.find(x=>x.id === selectedPart);
    if(!p){ setPartMsg('Seleccione una partición válida.'); return; }
    if(p.system){ setPartMsg('Windows no se puede instalar en una partición reservada por el sistema.'); return; }
    setPartMsg('');
    renderInstaller('wifi');
    return;
  }
}

const WIFI_SSID = 'laColina';
const WIFI_PASS = '123456';

let wifiStepState = {

  selectedSsid: null,
  errorMsg: ''
};

const WIFI_NETWORKS = [
  { ssid:'laColina',       strength:4, secured:true,  target:true },

function renderWifiStep(){

function paintWifiScreen(){
  const root = document.getElementById('view-installer');

  const bars = (n)=>`

        </div>

  }).join('');

  let stageHtml = '';
  if(s.phase === 'select'){
    stageHtml = `
      <div class="text-[13px] text-white/75 mb-3">Seleccione una red para conectarse:</div>
      <div class="flex flex-col gap-2 max-h-[290px] overflow-y-auto pr-1">${netList}</div>`;
  } else if(s.phase === 'connecting'){
    stageHtml = `
      <div class="flex flex-col items-center justify-center py-10 text-white">
        <div class="spin w-10 h-10 border-[3px] border-white/25 border-t-[#4a9edb] rounded-full mb-5"></div>
        <div class="text-[15px] mb-1">Conectando a <span class="font-semibold">${s.selectedSsid}</span>…</div>
        <div class="text-[12px] text-white/55">Espere un momento</div>
      </div>`;
  } else if(s.phase === 'connected'){
    stageHtml = `
      <div class="flex flex-col items-center justify-center py-10 text-white fade-slide">
        <div class="w-14 h-14 rounded-full bg-emerald-500/20 border border-emerald-400 flex items-center justify-center text-[28px] mb-4">✓</div>
        <div class="text-[16px] font-semibold mb-1">Conectado a ${s.selectedSsid}</div>
        <div class="text-[12px] text-white/60">Red doméstica · Acceso a Internet</div>
        <div class="text-[12px] text-emerald-300 mt-3">Conexión establecida correctamente</div>
      </div>`;
  }

  let passHtml = '';
  const selNet = WIFI_NETWORKS.find(n=>n.ssid === s.selectedSsid);
  if(selNet && s.phase === 'select'){
    passHtml = `
      <div class="mt-4">
        <div class="text-[12px] text-white/80 mb-1">Contraseña de red para "${selNet.ssid}"</div>
        <input id="wifiPass" type="password" placeholder="Escriba la contraseña de la red"
               class="w-full bg-[#0f2c45] border border-white/40 px-3 py-2 text-white placeholder-white/35">
      </div>`;
  }

  root.innerHTML = `
    <div class="absolute inset-0 flex items-center justify-center" style="${BG}">
      <div class="w-[620px] text-white">
        <div class="text-[26px] font-light mb-2">Conéctese a una red</div>
        <div class="text-[13px] text-white/60 mb-6">Si se conecta a una red ahora, podrá seguir usando la conexión durante la configuración.</div>

        ${stageHtml}
        ${passHtml}

        <div id="wifiMsg" class="text-[13px] mt-3 h-5 ${s.errorMsg ? 'text-red-300' : 'text-emerald-300'}">${s.errorMsg}</div>

        <div class="flex justify-between mt-6">
          <button id="wifiSkip" class="btn" ${s.phase !== 'select' ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>Omitir por ahora</button>
          <button id="wifiNext" class="btn btn-primary px-10" ${s.phase === 'connected' ? '' : 'disabled style="opacity:.4;cursor:not-allowed"'}>
            ${s.phase === 'connected' ? 'Continuar' : 'Conectar'}

        </div>

        wifiStepState.selectedSsid = b.dataset.ssid;
        wifiStepState.errorMsg = '';

      });
    });

    const btn = document.getElementById('wifiNext');
    btn.addEventListener('click', attemptWifiConnect);

    const skip = document.getElementById('wifiSkip');
    skip.addEventListener('click', ()=>{
      wifiStepState.errorMsg = 'Debe conectarse a la red "laColina" para continuar.';
      paintWifiScreen();
    });

    const inp = document.getElementById('wifiPass');
    if(inp) inp.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attemptWifiConnect(); });
  } else if(s.phase === 'connected'){
    const nextBtn = document.getElementById('wifiNext');
    if(nextBtn) nextBtn.addEventListener('click', ()=>{
      renderInstaller('copy');
    });
  }
}

function attemptWifiConnect(){
  const s = wifiStepState;
  if(!s.selectedSsid){
    s.errorMsg = 'Seleccione una red Wi-Fi de la lista.';
    paintWifiScreen();
    return;
  }
  const net = WIFI_NETWORKS.find(n=>n.ssid === s.selectedSsid);
  if(net.secured){
    const inp = document.getElementById('wifiPass');
    const pass = inp ? inp.value : '';
    if(s.selectedSsid === WIFI_SSID){
      if(pass !== WIFI_PASS){
        s.errorMsg = 'Contraseña incorrecta. Verifique la clave de la red "' + WIFI_SSID + '".';
        paintWifiScreen();
        return;
      }
    } else {
      if(pass.length < 6){
        s.errorMsg = 'La contraseña debe tener al menos 6 caracteres.';
        paintWifiScreen();
        return;
      }
    }
  }
  s.phase = 'connecting';
  s.errorMsg = '';
  paintWifiScreen();

  setTimeout(()=>{
    wifiStepState.phase = 'connected';
    paintWifiScreen();
  }, 1800);
}

function runCopy(){
  let pct = 0;
  const timer = setInterval(()=>{
    pct += 0.7 + Math.random() * 1.3;
    if(pct >= 100){
      pct = 100; clearInterval(timer);
      const stg = document.getElementById('copyStage'); const p1 = document.getElementById('copyPct'); const bar = document.getElementById('copyBar');
      if(stg) stg.textContent = 'Completado'; if(p1) p1.textContent = '100%'; if(bar) bar.style.width = '100%';
      setTimeout(()=>{ startRestartScreen(false); }, 1200);
      return;
    }
    const stage = COPY_STAGES.find(s => pct < s.to) || COPY_STAGES[COPY_STAGES.length-1];
    const stg = document.getElementById('copyStage'); const p1 = document.getElementById('copyPct'); const bar = document.getElementById('copyBar');
    if(stg) stg.textContent = stage.t; if(p1) p1.textContent = Math.floor(pct) + '%'; if(bar) bar.style.width = pct + '%';

function handleTaskbarClick(id){
  if(id === 'start'){ winState.startMenuOpen = !winState.startMenuOpen; renderTaskbar(); renderStartMenu(); return; }
  if(id === 'search'){ addToast('Búsqueda', 'Función de búsqueda no disponible en este simulador.', 'info'); return; }
  if(id === 'taskview'){ addToast('Vista de tareas', 'No hay otras ventanas abiertas.', 'info'); return; }
  if(id === 'explorer'){ addToast('Explorador de archivos', 'Utilice los iconos del escritorio para acceder a los archivos.', 'info'); return; }
  if(id === 'chrome'){ openChrome(); return; }
  if(id === 'settings'){ openSettings(); return; }
}

function handleDesktopIcon(id){

/* ---------- VENTANAS ---------- */
function renderActiveWindow(){
  const cont = document.getElementById('windowContainer');
  if(!cont) return;
  cont.innerHTML = '';

  if(winState.activeWindow === 'chrome'){
    cont.appendChild(buildChromeWindow());
    wireChromeEvents();
  } else if(winState.activeWindow === 'settings'){
    cont.appendChild(buildSettingsWindow());
    wireSettingsEvents();
  } else if(winState.activeWindow === 'installer'){
    cont.appendChild(buildInstallerWindow());
    const closeBtn = document.getElementById('drvClose');
    if(closeBtn) closeBtn.addEventListener('click', closeInstaller);
  }
}

function makeWindow({ title, width='900px', height='640px', content, dark=false, onClose }){
  const wrap = document.createElement('div');
  wrap.className = 'absolute inset-0 flex items-center justify-center pointer-events-auto';
  wrap.innerHTML = `
    <div class="rounded-lg overflow-hidden win-shadow win-show flex flex-col"
         style="width:${width};height:${height};background:${dark ? '#202124' : '#f3f3f3'}">
      <div class="h-[34px] flex items-center px-3 shrink-0 select-none"
           style="background:${dark ? '#35363a' : '#eaeaea'};color:${dark ? '#eaeaea' : '#222'}">
        <div class="text-[12px] flex-1 truncate">${title}</div>
        <div class="flex items-center gap-1">
          <div class="w-7 h-6 flex items-center justify-center text-[12px] hover:bg-white/10 rounded">−</div>
          <div class="w-7 h-6 flex items-center justify-center text-[12px] hover:bg-white/10 rounded">▢</div>
          <button data-close class="w-7 h-6 flex items-center justify-center text-[12px] hover:bg-red-500 hover:text-white rounded">✕</button>
        </div>
      </div>
      <div class="flex-1 overflow-hidden flex flex-col">${content}</div>
    </div>`;
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) onClose && onClose(); });
  wrap.querySelector('[data-close]').addEventListener('click', ()=> onClose && onClose());
  return wrap;
}

function wireChromeEvents(){
  if(winState.chromePage === 'home'){
    const btn = document.getElementById('hpSearchBtn');
    const sug = document.getElementById('hpProductSuggest');
    if(btn) btn.addEventListener('click', goToHpProduct);
    if(sug) sug.addEventListener('click', goToHpProduct);
  } else {
    const sel = document.getElementById('hpOsSelect');
    if(sel) sel.addEventListener('change', ()=>{
      if(sel.value !== 'Windows 11' && sel.value !== 'Windows 11 (64 bits)'){
        addToast('Sistema operativo', 'Los controladores de este equipo están optimizados para Windows 11.', 'info');
        sel.value = 'Windows 11';
      }
    });
    document.querySelectorAll('[data-dl]').forEach(b=>{
      b.addEventListener('click', ()=> downloadDriver(parseInt(b.dataset.dl, 10), b));
    });
  }
}
function goToHpProduct(){
  winState.chromePage = 'product';
  renderActiveWindow();
  setTimeout(()=>{
    addToast('Página de controladores', 'Seleccione y descargue cada controlador de la lista.', 'info');
  }, 300);
}

/* ---------- DESCARGA DE DRIVERS ---------- */
function downloadDriver(id, btn){
  const d = winState.drivers.find(x=>x.id === id);
  if(!d || d.downloaded) return;
  btn.disabled = true;
  btn.innerHTML = 'Descargando… 0%';
  btn.style.background = '#7cb8dd';

  let pct = 0;
  const iv = setInterval(()=>{
    pct += 6 + Math.random() * 10;
    if(pct >= 100){
      pct = 100;
      clearInterval(iv);
      d.downloaded = true;
      renderActiveWindow();
      renderDesktopFiles();
      const allDownloaded = winState.drivers.every(x=>x.downloaded);
      addToast('Descarga completada', `${d.name} (${d.file}) descargado. Ejecútelo desde el escritorio para instalarlo.`, 'success');
      if(allDownloaded && !winState.drivers.every(x=>x.installed)){
        setTimeout(()=>{
          addToast('Todos los controladores descargados',
            'Haga doble clic en cada archivo .exe del escritorio para instalar los controladores.', 'info');
        }, 800);
      }
      return;
    }
    btn.innerHTML = 'Descargando… ' + Math.floor(pct) + '%';
  }, 120);
}

/* ---------- INSTALADOR DE DRIVER ---------- */
function startDriverInstall(id){
  const d = winState.drivers.find(x=>x.id === id);
  if(!d) return;
  if(!d.downloaded){ addToast('Archivo no encontrado', 'Primero descargue el controlador desde el sitio de HP.', 'error'); return; }
  if(d.installed){ addToast('Ya instalado', `${d.name} ya está instalado en el sistema.`, 'info'); return; }
  if(winState.installingDriverId !== null){
    addToast('Instalación en curso', 'Espere a que finalice la instalación actual.', 'error');
    return;
  }
  winState.installingDriverId = id;
  winState.installPct = 0;
  winState.activeWindow = 'installer';
  renderActiveWindow();
  renderTaskbar();
  runDriverInstall(d);
}

function buildInstallerWindow(){
  const d = winState.drivers.find(x=>x.id === winState.installingDriverId);
  const name = d ? d.name : 'Instalador';
  const pct = Math.floor(winState.installPct);
  const done = pct >= 100;

  const closeBtnHtml = done
    ? `<button id="drvClose" class="px-6 py-2 rounded border border-gray-300 text-[13px] text-gray-700 bg-white hover:bg-gray-50">Cerrar</button>`
    : `<button disabled class="px-6 py-2 rounded border border-gray-300 text-[13px] text-gray-400 bg-white opacity-50 cursor-not-allowed">Cerrar</button>`;

  const content = `
    <div class="flex-1 p-8 flex flex-col" style="background:#f3f3f3">
      <div class="flex items-center gap-4 mb-6">
        <div class="w-12 h-12 rounded bg-[#e8f1f8] flex items-center justify-center text-[24px]">⚙️</div>
        <div>
          <div class="text-[16px] font-semibold text-gray-800">Instalación de controlador HP</div>
          <div class="text-[13px] text-gray-600">${name}</div>
        </div>
      </div>

      <div id="drvStage" class="text-[13px] text-gray-700 mb-2">
        ${done ? 'Instalación completada correctamente.' : 'Instalando componente… no apague el equipo.'}
      </div>

      <div class="w-full h-[10px] bg-gray-200 rounded overflow-hidden">
        <div id="drvBar" class="h-full transition-all" style="width:${pct}%;background:${done ? '#10b981' : '#0096D6'}"></div>
      </div>

      <div class="flex justify-between text-[12px] text-gray-500 mt-2">
        <span id="drvStatus">${done ? 'Listo' : 'Progreso'}</span>
        <span id="drvPct">${pct}%</span>
      </div>

      <div id="drvCloseWrap" class="mt-auto flex justify-end gap-2 pt-6">
        ${closeBtnHtml}
      </div>
    </div>`;

  return makeWindow({
    title:'Instalador de controladores HP — Setup',
    width:'560px', height:'360px',
    content, dark:false,
    onClose: done ? closeInstaller : ()=>{ addToast('Instalación en curso', 'Espere a que finalice la instalación.', 'error'); }
  });
}

function runDriverInstall(d){
  const step = ()=>{
    winState.installPct += 5 + Math.random() * 6;
    const pct = Math.min(100, Math.floor(winState.installPct));

    const bar = document.getElementById('drvBar');
    const pctEl = document.getElementById('drvPct');
    const stage = document.getElementById('drvStage');

    if(bar) bar.style.width = pct + '%';
    if(pctEl) pctEl.textContent = pct + '%';

    if(winState.installPct >= 100){
      winState.installPct = 100;
      d.installed = true;

      if(bar){ bar.style.width = '100%'; bar.style.background = '#10b981'; }
      if(pctEl) pctEl.textContent = '100%';
      if(stage) stage.textContent = 'Instalación completada correctamente.';

      const statusEl = document.getElementById('drvStatus');
      if(statusEl) statusEl.textContent = 'Listo';

      const wrap = document.getElementById('drvCloseWrap');
      if(wrap){
        wrap.innerHTML = `<button id="drvClose" class="px-6 py-2 rounded border border-gray-300 text-[13px] text-gray-700 bg-white hover:bg-gray-50">Cerrar</button>`;
        document.getElementById('drvClose').addEventListener('click', closeInstaller);
      }

      renderDesktopFiles();
      addToast('Controlador instalado', `${d.name} se instaló correctamente.`, 'success');

      const allInstalled = winState.drivers.every(x=>x.installed);
      if(allInstalled){
        setTimeout(()=>{
          addToast('Todos los controladores instalados',
            'Ahora puede actualizar Windows. Abra Configuración → Windows Update.', 'success');
        }, 900);
      }
      return;
    }
    setTimeout(step, 120 + Math.random() * 120);
  };
  setTimeout(step, 200);
}

function closeInstaller(){
  winState.activeWindow = null;
  winState.installingDriverId = null;
  renderTaskbar();
  renderActiveWindow();
}

/* ---------- CONFIGURACIÓN DE WINDOWS ---------- */

  const pendingDrivers = winState.drivers.filter(d=>!d.installed).length;
  if(pendingDrivers > 0){

  winState.activeWindow = 'settings';

function wireSettingsEvents(){
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.cat !== 'update') addToast('Configuración', 'Solo la sección "Windows Update" está disponible en este simulador.', 'info');

  });

  if(btnChk) btnChk.addEventListener('click', runWindowsUpdate);
  const btnRst = document.getElementById('btnRestartNow');
  if(btnRst) btnRst.addEventListener('click', performUpdateRestart);
}

/* ---------- WINDOWS UPDATE ---------- */
function runWindowsUpdate(){
  winState.updateStatus = 'checking';
  winState.updatePct = 0;
  renderActiveWindow();

  let pct = 0;
  const iv = setInterval(()=>{
    pct += 8 + Math.random() * 10;
    if(pct >= 100){
      pct = 100; clearInterval(iv);
      winState.updatePct = 0;
      winState.updateStatus = 'downloading';
      renderActiveWindow();
      runUpdateDownload();
      return;
    }
    winState.updatePct = pct;
    updateProgressUI(pct);
  }, 150);
}
function runUpdateDownload(){
  let pct = 0;
  const iv = setInterval(()=>{
    pct += 4 + Math.random() * 8;
    if(pct >= 100){
      pct = 100; clearInterval(iv);
      winState.updatePct = 0;
      winState.updateStatus = 'installing';
      renderActiveWindow();
      runUpdateInstall();
      return;
    }
    winState.updatePct = pct;
    updateProgressUI(pct);
  }, 160);
}
function runUpdateInstall(){
  let pct = 0;
  const iv = setInterval(()=>{
    pct += 3 + Math.random() * 6;
    if(pct >= 100){
      pct = 100; clearInterval(iv);
      winState.updateStatus = 'restart';
      winState.updatePct = 100;
      renderActiveWindow();
      addToast('Actualización descargada e instalada',
        'Se requiere reiniciar el equipo para completar la instalación.', 'info');
      return;
    }
    winState.updatePct = pct;
    updateProgressUI(pct);
  }, 180);
}
function updateProgressUI(pct){
  const bar = document.getElementById('updateBar');
  const pctEl = document.getElementById('updatePct');
  if(bar) bar.style.width = pct + '%';
  if(pctEl) pctEl.textContent = Math.floor(pct) + '% completado';
}

/* ---------- REINICIO POR ACTUALIZACIÓN + PANTALLA DE BLOQUEO ---------- */
function performUpdateRestart(){
  winState.activeWindow = null;
  renderTaskbar();
  renderActiveWindow();

  const root = document.getElementById('view-desktop');
  const overlay = document.createElement('div');
  overlay.className = 'absolute inset-0 z-[100] bg-black flex flex-col items-center justify-center text-white pointer-events-auto';
  overlay.innerHTML = `
    <div class="text-[20px] font-light mb-3">Actualizando Windows…</div>
    <div class="text-[13px] text-white/60 mb-6">No apague el equipo</div>
    <div class="w-[320px] h-[6px] bg-white/15 rounded overflow-hidden">
      <div id="upBar" class="h-full bg-[#4a9edb] transition-all" style="width:0%"></div>
    </div>
    <div id="upPct" class="text-[12px] text-white/50 mt-2">0%</div>`;
  root.appendChild(overlay);

  let pct = 0;
  const iv = setInterval(()=>{
    pct += 4 + Math.random() * 7;
    if(pct >= 100){
      pct = 100; clearInterval(iv);
      const b = document.getElementById('upBar'); const t = document.getElementById('upPct');
      if(b) b.style.width = '100%'; if(t) t.textContent = '100%';
      setTimeout(()=>{
        overlay.remove();
        showLockScreen();
      }, 900);
      return;
    }
    const b = document.getElementById('upBar'); const t = document.getElementById('upPct');
    if(b) b.style.width = pct + '%'; if(t) t.textContent = Math.floor(pct) + '%';
  }, 200);
}

/* ---------- PANTALLA DE BLOQUEO ---------- */
function showLockScreen(){
  const root = document.getElementById('view-desktop');
  const lock = document.createElement('div');
  lock.className = 'absolute inset-0 z-[200] flex items-center justify-center pointer-events-auto';
  lock.style.background = 'linear-gradient(135deg, #0a2a4a 0%, #0d3f66 50%, #051a2e 100%)';

  const now = new Date();
  const timeStr = now.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  const dateStr = now.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});

  lock.innerHTML = `
    <div class="text-center text-white">
      <div class="text-[76px] font-extralight leading-none mb-3">${timeStr}</div>
      <div class="text-[14px] text-white/70 mb-12 capitalize">${dateStr}</div>

      <div class="w-20 h-20 rounded-full bg-gradient-to-br from-[#4a9edb] to-[#2a5f9e] flex items-center justify-center text-white text-[34px] font-light mx-auto mb-4">
        ${winState.user.charAt(0).toUpperCase()}
      </div>
      <div class="text-[16px] mb-8">${winState.user}</div>

      <div id="lockInputWrap" class="relative w-[300px] mx-auto">
        <input id="lockPwd" type="password" placeholder="Contraseña"
               class="w-full px-4 py-2 pr-12 bg-white/15 border border-white/30 rounded text-white placeholder-white/60 text-[13px] outline-none focus:border-white/60 transition-colors">
        <button id="lockBtn" class="absolute right-1 top-1 bottom-1 px-3 text-white/70 hover:text-white text-[15px]">→</button>
      </div>

      <div id="lockErr" class="text-red-300 text-[12px] mt-3 h-4"></div>
      <div class="text-[11px] text-white/40 mt-6">Presione Enter para iniciar sesión</div>
    </div>`;

  root.appendChild(lock);

  const inp   = lock.querySelector('#lockPwd');
  const btn   = lock.querySelector('#lockBtn');
  const err   = lock.querySelector('#lockErr');
  const wrapEl = lock.querySelector('#lockInputWrap');

  setTimeout(()=> inp.focus(), 120);

  const submit = ()=>{
    if(inp.value === winState.password){
      lock.remove();
      winState.updateStatus = 'done';
      renderWindows11();
      setTimeout(()=>{
        addToast('Equipo actualizado',
          'Windows se ha actualizado correctamente. Todos los controladores HP están instalados y el sistema está al día.',
          'success');
      }, 700);
      setTimeout(()=>{
        addToast('Simulación completada',
          'Ha finalizado el procedimiento técnico completo: BIOS → Wi-Fi → Instalación → Controladores HP → Windows Update.',
          'success');
      }, 2200);
    } else {
      err.textContent = 'La contraseña es incorrecta. Inténtelo de nuevo.';
      inp.value = '';
      inp.focus();
      wrapEl.classList.remove('lock-shake');
      void wrapEl.offsetWidth;
      wrapEl.classList.add('lock-shake');
      inp.style.borderColor = '#ef4444';
      setTimeout(()=>{ inp.style.borderColor = ''; }, 800);
    }
  };

  btn.addEventListener('click', submit);
  inp.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
}

/* ---------- SISTEMA DE NOTIFICACIONES ---------- */
function addToast(title, msg, type){
  const area = document.getElementById('notifArea');
  if(!area) return;
  const el = document.createElement('div');
  el.className = 'toast-in pointer-events-auto rounded-lg shadow-2xl px-4 py-3 text-white text-[13px] flex gap-3 items-start';
  el.style.background = 'rgba(36,36,36,.96)';
  el.style.border = '1px solid rgba(255,255,255,.10)';
  el.style.backdropFilter = 'blur(20px)';

  const icon = type === 'error' ? '⚠️' : type === 'success' ? '✅' : 'ℹ️';
  el.innerHTML = `
    <div class="text-[17px] leading-none mt-[1px]">${icon}</div>
    <div class="flex-1">
      <div class="font-semibold mb-0.5">${title}</div>
      <div class="text-white/75 leading-snug">${msg}</div>
    </div>
    <button class="text-white/50 hover:text-white text-[14px] leading-none">✕</button>`;
  el.querySelector('button').addEventListener('click', ()=> el.remove());
  area.appendChild(el);

  setTimeout(()=>{
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(30px)';
    setTimeout(()=> el.remove(), 320);
  }, 6200);
}

/* ---------- CABLEADO GLOBAL ---------- */
document.addEventListener('click', (e)=>{
  if(currentView !== 'desktop') return;
  if(winState.startMenuOpen){
    const sm = document.getElementById('startMenu');
    const tb = document.getElementById('taskbar');
    if(sm && !sm.contains(e.target) && tb && !tb.contains(e.target)){
      winState.startMenuOpen = false;
      renderTaskbar(); renderStartMenu();
    }
  }
});

/* =========================================================
   TECLADO GLOBAL
   ========================================================= */
document.addEventListener('keydown', (e)=>{
  if(currentView === 'bios') handleBiosKey(e);
  else if(currentView === 'bootprompt') handleBootPromptKey(e);
});

/* =========================================================
   INICIALIZACIÓN
   ========================================================= */
function init(){
  fitMonitor();
  bios.tab = 0;
  bios.row = firstSelectable(getTabRows(0));
  renderBios();
  showView('bios');
}
init();
</script>
</body>
